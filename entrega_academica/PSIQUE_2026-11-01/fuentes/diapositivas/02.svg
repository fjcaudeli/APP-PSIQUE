<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
<defs><marker id="flecha" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#284f45"/></marker></defs>
<rect x="0" y="0" width="1280" height="720" rx="0" fill="#faf9f5" stroke="#faf9f5"/>
<text font-family="Segoe UI, Arial, sans-serif" font-size="42" font-weight="700" fill="#284f45">
<tspan x="55" y="72.0">El problema del consultorio</tspan>
</text>
<text font-family="Segoe UI, Arial, sans-serif" font-size="23" font-weight="400" fill="#647168">
<tspan x="58" y="114.0">Relacionar agenda, seguimiento y cobros requiere información consistente</tspan>
</text>
<text font-family="Segoe UI, Arial, sans-serif" font-size="51" font-weight="700" fill="#284f45">
<tspan x="62" y="228.0">01</tspan>
</text>
<text font-family="Segoe UI, Arial, sans-serif" font-size="31" font-weight="700" fill="#284f45">
<tspan x="190" y="211.0">Información dispersa</tspan>
</text>
<text font-family="Segoe UI, Arial, sans-serif" font-size="25" font-weight="400" fill="#293b34">
<tspan x="190" y="254.0">Pacientes, fechas y anotaciones pueden quedar en registros separados.</tspan>
</text>
<text font-family="Segoe UI, Arial, sans-serif" font-size="51" font-weight="700" fill="#284f45">
<tspan x="62" y="370.0">02</tspan>
</text>
<text font-family="Segoe UI, Arial, sans-serif" font-size="31" font-weight="700" fill="#284f45">
<tspan x="190" y="353.0">Próximos encuentros sin confirmar</tspan>
</text>
<text font-family="Segoe UI, Arial, sans-serif" font-size="25" font-weight="400" fill="#293b34">
<tspan x="190" y="396.0">Hace falta distinguir quién tiene reserva y quién sigue pendiente.</tspan>
</text>
<text font-family="Segoe UI, Arial, sans-serif" font-size="51" font-weight="700" fill="#284f45">
<tspan x="62" y="512.0">03</tspan>
</text>
<text font-family="Segoe UI, Arial, sans-serif" font-size="31" font-weight="700" fill="#284f45">
<tspan x="190" y="495.0">Saldos difíciles de consultar</tspan>
</text>
<text font-family="Segoe UI, Arial, sans-serif" font-size="25" font-weight="400" fill="#293b34">
<tspan x="190" y="538.0">Cada sesión necesita relacionar honorarios y cobrado acumulado.</tspan>
</text>
<text font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="400" fill="#647168">
<tspan x="59" y="696.0">PSIQUE</tspan>
