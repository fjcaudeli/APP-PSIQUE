<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="620" viewBox="0 0 1100 620">
<defs><marker id="flecha" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#284f45"/></marker></defs>
<text font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="700" fill="#284f45">
<tspan x="20" y="33.0">Cliente Angular</tspan>
</text>
<text font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="700" fill="#284f45">
<tspan x="410" y="33.0">API Express</tspan>
</text>
<text font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="700" fill="#284f45">
<tspan x="800" y="33.0">PostgreSQL</tspan>
</text>
<rect x="20" y="80" width="280" height="125" rx="12" fill="#dcece8" stroke="#cdd9cf"/>
<text font-family="Segoe UI, Arial, sans-serif" font-size="29" font-weight="700" fill="#284f45">
<tspan x="40" y="123.0">1. Acceso</tspan>
</text>
<text font-family="Segoe UI, Arial, sans-serif" font-size="23" font-weight="400" fill="#293b34">
<tspan x="40" y="161.0">Email y contraseña</tspan>
</text>
<rect x="410" y="80" width="280" height="125" rx="12" fill="#e8eee3" stroke="#cdd9cf"/>
<text font-family="Segoe UI, Arial, sans-serif" font-size="29" font-weight="700" fill="#284f45">
<tspan x="430" y="123.0">2. Validación</tspan>
</text>
<text font-family="Segoe UI, Arial, sans-serif" font-size="23" font-weight="400" fill="#293b34">
<tspan x="430" y="161.0">Formato y búsqueda</tspan>
</text>
<rect x="800" y="80" width="280" height="125" rx="12" fill="#e8eee3" stroke="#cdd9cf"/>
<text font-family="Segoe UI, Arial, sans-serif" font-size="29" font-weight="700" fill="#284f45">
<tspan x="820" y="123.0">3. Cuenta</tspan>
</text>
<text font-family="Segoe UI, Arial, sans-serif" font-size="23" font-weight="400" fill="#293b34">
<tspan x="820" y="161.0">Hash y confirmación</tspan>
</text>
<polyline points="300,142 410,142" fill="none" stroke="#284f45" stroke-width="2" marker-end="url(#flecha)"/>
<polyline points="690,142 800,142" fill="none" stroke="#284f45" stroke-width="2" marker-end="url(#flecha)"/>
<rect x="410" y="295" width="280" height="125" rx="12" fill="#e8eee3" stroke="#cdd9cf"/>
<text font-family="Segoe UI, Arial, sans-serif" font-size="29" font-weight="700" fill="#284f45">
<tspan x="430" y="338.0">4. Login</tspan>
</text>
<text font-family="Segoe UI, Arial, sans-serif" font-size="23" font-weight="400" fill="#293b34">
<tspan x="430" y="376.0">Argon2id y JWT HS256</tspan>
</text>
<rect x="20" y="295" width="280" height="125" rx="12" fill="#dcece8" stroke="#cdd9cf"/>
<text font-family="Segoe UI, Arial, sans-serif" font-size="29" font-weight="700" fill="#284f45">
<tspan x="40" y="338.0">5. Sesión</tspan>
</text>
<text font-family="Segoe UI, Arial, sans-serif" font-size="23" font-weight="400" fill="#293b34">
<tspan x="40" y="376.0">Token con vencimiento</tspan>
</text>
<polyline points="940,205 940,252 550,252 550,295" fill="none" stroke="#284f45" stroke-width="2" marker-end="url(#flecha)"/>
<polyline points="410,355 300,355" fill="none" stroke="#284f45" stroke-width="2" marker-end="url(#flecha)"/>
<rect x="20" y="490" width="280" height="115" rx="12" fill="#dcece8" stroke="#cdd9cf"/>
<text font-family="Segoe UI, Arial, sans-serif" font-size="29" font-weight="700" fill="#284f45">
<tspan x="40" y="533.0">6. HTTP privado</tspan>
</text>
<text font-family="Segoe UI, Arial, sans-serif" font-size="23" font-weight="400" fill="#293b34">
<tspan x="40" y="571.0">Bearer en la API</tspan>
</text>
<rect x="410" y="490" width="280" height="115" rx="12" fill="#e8eee3" stroke="#cdd9cf"/>
<text font-family="Segoe UI, Arial, sans-serif" font-size="29" font-weight="700" fill="#284f45">
<tspan x="430" y="533.0">7. Middleware</tspan>
</text>
<text font-family="Segoe UI, Arial, sans-serif" font-size="23" font-weight="400" fill="#293b34">
<tspan x="430" y="571.0">JWT y usuario vigente</tspan>
</text>
<rect x="800" y="490" width="280" height="115" rx="12" fill="#e8eee3" stroke="#cdd9cf"/>
<text font-family="Segoe UI, Arial, sans-serif" font-size="29" font-weight="700" fill="#284f45">
<tspan x="820" y="533.0">8. Consulta</tspan>
</text>
<text font-family="Segoe UI, Arial, sans-serif" font-size="23" font-weight="400" fill="#293b34">
<tspan x="820" y="571.0">Filtra por usuarioId</tspan>
</text>
<polyline points="155,420 155,490" fill="none" stroke="#284f45" stroke-width="2" marker-end="url(#flecha)"/>
<polyline points="300,545 410,545" fill="none" stroke="#284f45" stroke-width="2" marker-end="url(#flecha)"/>
<polyline points="690,545 800,545" fill="none" stroke="#284f45" stroke-width="2" marker-end="url(#flecha)"/>
</svg>