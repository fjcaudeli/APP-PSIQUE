<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="620" viewBox="0 0 1100 620">
<defs><marker id="flecha" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#284f45"/></marker></defs>
<rect x="40" y="25" width="1000" height="125" rx="12" fill="#dcece8" stroke="#cdd9cf"/>
<text font-family="Segoe UI, Arial, sans-serif" font-size="29" font-weight="700" fill="#284f45">
<tspan x="60" y="68.0">Presentación: Ionic + Angular</tspan>
</text>
<text font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="400" fill="#293b34">
<tspan x="60" y="107.0">Navegador web o APK Android con Capacitor. Formularios y servicios HTTP.</tspan>
</text>
<rect x="40" y="245" width="670" height="125" rx="12" fill="#e8eee3" stroke="#cdd9cf"/>
<text font-family="Segoe UI, Arial, sans-serif" font-size="29" font-weight="700" fill="#284f45">
<tspan x="60" y="288.0">Aplicación: Node.js + Express</tspan>
</text>
<text font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="400" fill="#293b34">
<tspan x="60" y="327.0">API REST, JWT, reglas de negocio y pool pg. Máximo: 5</tspan>
<tspan x="60" y="358.68">conexiones.</tspan>
</text>
<rect x="790" y="245" width="270" height="125" rx="12" fill="#fff5c6" stroke="#cdd9cf"/>
<text font-family="Segoe UI, Arial, sans-serif" font-size="29" font-weight="700" fill="#284f45">
<tspan x="810" y="288.0">Resend</tspan>
</text>
<text font-family="Segoe UI, Arial, sans-serif" font-size="23" font-weight="400" fill="#293b34">
<tspan x="810" y="326.0">Correo de acceso</tspan>
<tspan x="810" y="356.36">por HTTPS.</tspan>
</text>
<rect x="40" y="465" width="670" height="125" rx="12" fill="#e8eee3" stroke="#cdd9cf"/>
<text font-family="Segoe UI, Arial, sans-serif" font-size="29" font-weight="700" fill="#284f45">
<tspan x="60" y="508.0">Persistencia: PostgreSQL 18.6</tspan>
</text>
<text font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="400" fill="#293b34">
<tspan x="60" y="547.0">psique: usuarios, pacientes, turnos y sesiones. Historial</tspan>
<tspan x="60" y="578.68">técnico de migraciones.</tspan>
</text>
