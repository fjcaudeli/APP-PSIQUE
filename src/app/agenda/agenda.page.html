<ion-content><div class="pagina pagina-calendario">
  <header class="encabezado"><div class="marca"><span class="marca-simbolo" aria-hidden="true">Ψ</span><div><p class="marca-nombre">PSIQUE</p><p class="marca-descripcion">Seguimiento psicoterapéutico</p></div></div></header>
  <main><section class="presentacion"><p class="etiqueta">Tu espacio profesional</p><h1>Agenda</h1><p class="introduccion">Tus sesiones y franjas libres. Lunes a sábado, de 08:00 a 22:00.</p><div class="acciones"><a class="boton" routerLink="/agenda/agendar" routerDirection="forward">Agendar sesión</a><a class="boton boton-secundario" routerLink="/proximas-sesiones" routerDirection="forward">Pendientes de agendar</a></div></section>
  @if (cargando) { <p role="status">Cargando agenda...</p> }
  @else if (error) { <p class="error" role="alert">{{ error }}</p><button type="button" class="boton" (click)="cargar()">Reintentar</button> }
  @else if (calendario) { <app-calendario [calendario]="calendario" [fechaVisible]="semanaVisible" (cambiarSemana)="cargar($event)" (elegirDia)="agendar($event)"></app-calendario> }
  </main></div></ion-content>
